# Shared PATH and desktop-file search locations. Local overrides can load later.
PATH=${XDG_BIN_HOME:-$HOME/.local/bin}:${PATH:-/usr/local/bin:/usr/bin:/bin}
XDG_DATA_DIRS=${XDG_DATA_DIRS:-/usr/local/share:/usr/share}:${XDG_DATA_HOME:-$HOME/.local/share}/flatpak/exports/share:/var/lib/flatpak/exports/share
