[backdrop]
enabled = false

[bar.default]
border = "primary"
border_width = 2.0
center = [ "date", "clock" ]
end = [ "media", "tray", "group:g1", "control-center", "session" ]
margin_edge = 1
margin_ends = 0
padding = 10
position = "left"
radius = 6
thickness = 36
widget_spacing = 12

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0
    radius = 6.0

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660

    [idle.behavior.suspend]
    action = "suspend"
    enabled = false
    lock_before_suspend = true
    timeout = 900

[location]
address = "Bühl, Germany"

[notification]
position = "top_left"

[shell]
font_family = "Maple Mono Normal NFMono"
polkit_agent = true
settings_show_advanced = true

    [shell.shadow]
    direction = "center"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"


[wallpaper]
directory = "~/Pictures/Wallpaper"
transition = [ "fade" ]

    [wallpaper.default]
    path = "~/Pictures/Wallpaper/default-bg.jpg"

    [wallpaper.last]
    path = "~/Pictures/Wallpaper/default-bg.jpg"

[weather]
address = "Bühl, Germany"

[widget.clock]
color = "secondary"
font_weight = 500
scale = 1.1500000000000001
vertical_format = "{:%H}\\n{:%M}"

[widget.control-center]
color = "secondary"
glyph = "settings"

[widget.date]
color = "on_surface_variant"
font_weight = 300
scale = 1.1500000000000001
vertical_format = "{:%d}\\n{:%m}"

[widget.launcher]
custom_image = "~/.local/share/icons/n0_logo.svg"
custom_image_colorize = true
icon_color = "tertiary"
scale = 1.8

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.session]
color = "tertiary"

[widget.tray]
hidden = [ "Network" ]

[widget.volume]
show_label = false

[widget.workspaces]
capsule = true
capsule_radius = 4
