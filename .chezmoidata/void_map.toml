# Void Linux (xbps) package name mapping from Arch Linux names
# This maps Arch package names to their Void equivalents

[void_map]
# Package name mappings (Arch -> Void)
"breeze5" = "breeze-qt5"
"bluez-utils" = "bluez"  # + bluez-deprecated needed for legacy tools
"fish" = "fish-shell"
"frameworkintegration" = "kf6-frameworkintegration"
"gst-plugin-pipewire" = "gstreamer1-pipewire"
"greetd-tuigreet" = "tuigreet"
"imagemagick" = "ImageMagick"
"inter-font" = "font-inter"
"libpulse" = "libpulseaudio"
"networkmanager" = "NetworkManager"
"otf-monaspace-nerdfonts" = "nerd-fonts-otf"
"pipewire-alsa" = "alsa-pipewire"
"pipewire-jack" = "libjack-pipewire"
"pipewire-pulse" = "pipewire"  # part of main pkg on Void
"qt6ct-kde" = "qt6ct"
"ttf-cascadia-code-nerd" = "nerd-fonts-ttf"
"ttf-jetbrains-mono-nerd" = "nerd-fonts-ttf"  # dedup: same as above
"ttf-roboto" = "fonts-roboto-ttf"
"noctalia-git" = "noctalia"