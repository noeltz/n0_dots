# System services to enable (runit: symlinked into /var/service). Idempotent.
enable_system = [
  "NetworkManager",
  "chronyd",
  "dbus",
  "socklog-unix",
  "nanoklogd",
  "libvirtd",
  "virtlockd",
  "virtlogd",
]

# System services to disable and stop (runit: removed from /var/service, sv down). Idempotent.
disable_system = ["acpid", "dhcpcd", "wpa_supplicant", "iwd", "ntpd", "openntpd", "timesyncd"]
